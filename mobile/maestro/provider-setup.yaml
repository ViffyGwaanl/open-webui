appId: com.openwebui.mobile
env:
  PROVIDER_PRESET: "OpenAI"
  CURRENT_DISPLAY_NAME: "OpenAI Main"
  DISPLAY_NAME: "OpenAI Main"
  CURRENT_BASE_URL: "https://api.openai.com/v1"
  BASE_URL: "https://api.openai.com/v1"
  API_KEY: ""
---
- launchApp
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "${PROVIDER_PRESET}"
- tapOn: "${CURRENT_DISPLAY_NAME}"
- eraseText
- inputText: "${DISPLAY_NAME}"
- tapOn: "${CURRENT_BASE_URL}"
- eraseText
- inputText: "${BASE_URL}"
- tapOn: "API key"
- eraseText
- inputText: "${API_KEY}"
- tapOn: "Save provider"
- assertVisible: "${DISPLAY_NAME}"
