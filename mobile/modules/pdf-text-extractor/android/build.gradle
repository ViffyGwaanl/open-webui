plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pdftextextractor'
version = '0.7.10'

android {
  namespace "expo.modules.pdftextextractor"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.tom-roush:pdfbox-android:2.0.27.0"
}
